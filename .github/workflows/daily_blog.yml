name: Daily Blog

on:
  schedule:
    # 毎日 09:00 JST = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install openai

      - name: Generate post
        run: |
          python scripts/generate_blog.py

      - name: Commit & push if changed
        run: |
          if git status --porcelain | grep .; then
            git config user.name "auto-blog-bot"
            git config user.email "auto-blog-bot@users.noreply.github.com"
            git add -A
            git commit -m "chore: add daily post"
            git push
          else
            echo "No changes to commit"
          fi
