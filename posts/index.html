<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記事一覧 | Nekonote Ops Service</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="hero" style="padding: 24px 16px;">
    <div class="header-content">
      <h1 class="service-name">記事一覧</h1>
      <p class="tagline">毎日更新：自動生成記事</p>
      <p><a href="../index.html">トップへ戻る</a></p>
    </div>
  </header>

  <main style="max-width: 900px; margin: 0 auto; padding: 16px;">
    <ul id="list" class="post-list"></ul>
  </main>

  <script>
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    fetch("./posts.json", { cache: "no-store" })
      .then(res => res.json())
      .then(items => {
        const ul = document.getElementById("list");
        ul.innerHTML = "";

        if (!Array.isArray(items) || items.length === 0) {
          ul.innerHTML = "<li>まだ記事がありません。</li>";
          return;
        }

        // 旧形式（["2026-02-09.html", ...]）でも一応動くように保険
        const normalized = (typeof items[0] === "string")
          ? items.map(f => ({ file: f, date: f.replace(".html",""), title: f.replace(".html",""), thumb: "/images/thumb-default.png" }))
          : items;

        normalized.forEach(it => {
          const file = esc(it.file);
          const title = esc(it.title || it.date || it.file);
          const date = esc(it.date || (it.file ? it.file.replace(".html","") : ""));
          const thumb = esc(it.thumb || "/images/thumb-default.png");

          const li = document.createElement("li");
          li.className = "post-card";
          li.innerHTML = `
            <a class="post-card-link" href="./${file}">
              <img class="post-thumb" src="${thumb}" alt="">
              <div class="post-meta">
                <div class="post-title">${title}</div>
                <div class="post-date">${date}</div>
              </div>
            </a>
          `;
          ul.appendChild(li);
        });
      })
      .catch(() => {
        const ul = document.getElementById("list");
        ul.innerHTML = "<li>記事一覧の読み込みに失敗しました。</li>";
      });
  </script>
</body>
</html>
